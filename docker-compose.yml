version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: the_way_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: the_way
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d the_way']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    container_name: the_way_app
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/the_way
      NEXTAUTH_SECRET: change-me
      NEXTAUTH_URL: http://localhost:3000
      YANDEX_STORAGE_ENDPOINT: ${YANDEX_STORAGE_ENDPOINT:-https://storage.yandexcloud.net}
      YANDEX_STORAGE_BUCKET: ${YANDEX_STORAGE_BUCKET:-archive-storage}
      YANDEX_STORAGE_ACCESS_KEY: ${YANDEX_STORAGE_ACCESS_KEY:-YOUR_ACCESS_KEY}
      YANDEX_STORAGE_SECRET_KEY: ${YANDEX_STORAGE_SECRET_KEY:-YOUR_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
