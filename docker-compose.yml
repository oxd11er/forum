version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: the_way_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: the_way
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d the_way']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
